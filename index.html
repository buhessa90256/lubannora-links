<!doctype html>
<html lang="en">
<head>

  <title>Lubannora | لبان نُورا</title>
  <style>
    :root{--ink:#25130c;--brown:#4a2818;--gold:#d9af67;--cream:#f7ecd8;--muted:#dfc797}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;color:var(--cream);background:radial-gradient(ellipse at 50% 0%,#704228 0%,var(--ink) 53%,#160a06 100%);font-family:Georgia,'Times New Roman',serif}main{width:min(100%,540px);min-height:100svh;padding:28px 24px 34px;display:flex;flex-direction:column;align-items:center;text-align:center;position:relative;isolation:isolate}main:before,main:after{content:'';position:absolute;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.42;z-index:-1}main:before{width:330px;height:330px;top:13%;background:radial-gradient(circle,rgba(217,175,103,.17),transparent 67%)}main:after{width:130%;height:48%;bottom:-24%;background:radial-gradient(ellipse,rgba(236,203,139,.11),transparent 63%)}.top{margin-top:clamp(25px,8vh,90px)}.seal{width:76px;height:76px;margin:0 auto 20px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;color:var(--gold);font-size:29px;letter-spacing:-4px;padding-right:4px;box-shadow:0 0 0 5px rgba(217,175,103,.09),0 0 35px rgba(217,175,103,.18)}.arabic{margin:0 0 5px;color:var(--muted);font-size:16px;letter-spacing:2px;direction:rtl}h1{margin:0;color:var(--gold);font-size:clamp(42px,12vw,60px);font-weight:normal;letter-spacing:4px;text-transform:uppercase;line-height:1}.rule{width:75px;border:0;border-top:1px solid var(--gold);margin:24px auto 18px}.tagline{margin:0;font-size:13px;line-height:1.7;letter-spacing:2.4px;text-transform:uppercase;color:var(--cream)}.note{margin:17px 0 0;color:var(--muted);font-size:15px;font-style:italic}nav{width:100%;margin-top:auto;display:grid;gap:13px}.button{min-height:60px;display:flex;align-items:center;justify-content:center;gap:12px;padding:13px 20px;border:1px solid var(--gold);color:var(--cream);background:rgba(255,255,255,.035);text-decoration:none;font-family:Arial,sans-serif;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;transition:background .2s,transform .2s}.button:hover,.button:focus-visible{color:var(--ink);background:var(--gold);outline:none;transform:translateY(-2px)}.icon{width:20px;font-size:19px;line-height:1}footer{margin-top:25px;color:rgba(247,236,216,.58);font:11px Arial,sans-serif;letter-spacing:1.6px;text-transform:uppercase}@media(max-height:650px){.top{margin-top:20px}.seal{width:60px;height:60px;margin-bottom:13px}.rule{margin:16px auto 12px}.note{margin-top:9px}nav{margin-top:30px}}
  </style>
</head>
<body>
  <main>
    <section class="top" aria-label="Lubannora">
      <div class="seal" aria-hidden="true">LN</div>
      <p class="arabic">لبان نُورا</p>
      <h1>Lubannora</h1>
      <hr class="rule">
      <p class="tagline">The essence of Omani frankincense</p>
      <p class="note">A ritual, made luminous.</p>
    </section>
    <nav aria-label="Connect with Lubannora">
      <a class="button" href="https://wa.me/96871119920" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">◉</span>Chat on WhatsApp</a>
      <a class="button" href="https://www.instagram.com/lubannora" target="_blank" rel="noopener noreferrer"><span class="icon" aria-hidden="true">◎</span>Follow on Instagram</a>
    </nav>
    <footer>© Lubannora · Oman</footer>
  </main>
</body>
</html>
